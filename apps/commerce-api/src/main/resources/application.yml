server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - logging.yml
      - monitoring.yml
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 1000
            read-timeout: 2000

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

pg:
  callback-url: http://localhost:8080/api/v1/payments/callback
  clients:
    a:
      url: http://localhost:8082
    b:
      url: http://localhost:8092

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 50
        failure-rate-threshold: 60
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        record-exceptions:
          - feign.FeignException$FeignServerException
          - feign.RetryableException
        ignore-exceptions:
          - feign.FeignException$FeignClientException
    instances:
      pg-a:
        base-config: default
      pg-b:
        base-config: default

---
spring:
  config:
    activate:
      on-profile: local, test

---
# local 전용: data.sql admin seed 실행 (구 account-api application-local.yaml에서 이관)
# test 프로파일은 src/test/resources/application-test.yaml 의 sql.init.mode=never 가 우선 적용되어 seed 차단
spring:
  config:
    activate:
      on-profile: local
  docker:
    compose:
      file: docker/infra-compose.yml
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
# Local development defaults consumed by Spring Boot's spring-boot-docker-compose
# (registered as `developmentOnly` in apps/account-api/build.gradle.kts), so this file
# is NOT included in production artifacts (bootJar) and these values are not used in
# dev/qa/prd profiles. The credentials below are conventional local defaults — not
# secrets. Override via environment variables before any real deployment.
services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: loopers
      MYSQL_USER: application
      MYSQL_PASSWORD: application
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - loopers-mysql-data:/var/lib/mysql

volumes:
  loopers-mysql-data:

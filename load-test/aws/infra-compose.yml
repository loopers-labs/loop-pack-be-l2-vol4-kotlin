# R9 AWS infra 노드 compose — sut-compose.yml에서 commerce-api 제외 + 2노드 조정판.
#   R8 때 infra 노드에서 즉석 작성했던 것을 레포 자산화 (2026-07-16).
# 실행 (infra 노드): INFRA_PRIVATE_IP=<프라이빗IP> sudo -E docker compose -f infra-compose.yml up -d
#   - kafka ADVERTISED_LISTENERS 가 프라이빗 IP 기준이라 app 노드에서 접속 가능 (SG self-referencing)
#   - 호스트 포트는 0.0.0.0 바인딩 — 외부 노출은 SG 가 차단 (내 IP /32 + self-ref 만 허용)
# 시드 (앱 첫 부팅 = DDL=create 로 스키마 생성 완료 후):
#   sudo docker exec -i mysql mysql -uapplication -papplication loopers < perf-seed-l5.sql
#   sudo docker exec -i mysql mysql -uapplication -papplication loopers < perf-seed-order-arm.sql
#   sudo docker exec -i mysql mysql -uapplication -papplication loopers < perf-seed-queue-users.sql
#   sudo docker exec -i mysql mysql -uapplication -papplication loopers < perf-seed-ranking.sql

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    command:
      - --innodb-buffer-pool-size=4G
      - --max-connections=300
      # 서버 TZ = KST: 앱 JVM 이 KST 강제(CommerceApiApplication)라, 서버가 UTC 면 Connector/J 가
      # java.sql.Date 를 커넥션 TZ 로 포맷해 LocalDate 바인딩이 -1일 밀림 (2026-07-16 general_log 실측).
      # hibernate.jdbc.time_zone / timezone.default_storage 로는 교정 불가 확인 — 서버 TZ 정렬이 근본 해법.
      - --default-time-zone=+09:00
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=application
      - MYSQL_PASSWORD=application
      - MYSQL_DATABASE=loopers
      - MYSQL_CHARACTER_SET=utf8mb4
      - MYSQL_COLLATE=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapplication", "-papplication"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-master:
    image: redis:7.0
    container_name: redis-master
    ports:
      - "6379:6379"
    command:
      ["redis-server", "--appendonly", "yes", "--save", "", "--latency-monitor-threshold", "100"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis-readonly:
    image: redis:7.0
    container_name: redis-readonly
    depends_on:
      redis-master:
        condition: service_healthy
    ports:
      - "6380:6379"
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
       "--replicaof", "redis-master", "6379", "--replica-read-only", "yes",
       "--latency-monitor-threshold", "100"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 5s
      timeout: 2s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:3.5.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://${INFRA_PRIVATE_IP}:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR=1
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

commerce:
  events:
    catalog-topic: catalog-events
    order-topic: order-events
  ranking:
    consumer-group: commerce-ranking
    event-chunk-size: 500

---
spring:
  config:
    activate:
      on-profile: local, test

server:
  port: 8084

management:
  server:
    port: 8085

---
spring:
  config:
    activate:
      on-profile: dev

server:
  port: 8084

management:
  server:
    port: 8085

---
spring:
  config:
    activate:
      on-profile: qa

server:
  port: 8084

management:
  server:
    port: 8085

---
spring:
  config:
    activate:
      on-profile: prd

server:
  port: 8084

management:
  server:
    port: 8085

springdoc:
  api-docs:
    enabled: false

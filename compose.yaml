# Local development MySQL defaults. account-api 가 commerce-api 로 흡수되며
# spring-boot-docker-compose(developmentOnly) 등록은 이관하지 않았다 — 로컬 인프라는
# docker/infra-compose.yml 사용을 권장. 이 파일은 수동 docker compose 용으로만 남긴다.
# The credentials below are conventional local defaults — not secrets.
# Override via environment variables before any real deployment.
services:
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: loopers
      MYSQL_USER: application
      MYSQL_PASSWORD: application
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - loopers-mysql-data:/var/lib/mysql

volumes:
  loopers-mysql-data:

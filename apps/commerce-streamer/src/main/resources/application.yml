server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-streamer
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - redis.yml
      - kafka.yml
      - logging.yml
      - monitoring.yml

demo-kafka:
  test:
    topic-name: demo.internal.topic-v1

commerce-events:
  product-metrics:
    catalog-topic-name: catalog-events
    catalog-dlt-topic-name: catalog-events.DLT
    order-topic-name: order-events
    order-dlt-topic-name: order-events.DLT
    partitions: 3
    replicas: 1

commerce-ranking:
  score:
    like: 1.0 # 좋아요 건당
    order: 4.0 # 결제 완료 주문의 상품당
  carry-over:
    enabled: true
    cron: "0 55 23 * * *"
    decay: 0.5
    min-score: 1.0 # 감쇠 후 이 미만 제거 (롱테일 컷)
  rdb-sync:
    enabled: true
    fixed-delay-ms: 600000
    top-n: 1000

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: test
  kafka:
    admin:
      auto-create: false
    listener:
      auto-startup: false

commerce-ranking:
  carry-over:
    enabled: false
  rdb-sync:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false

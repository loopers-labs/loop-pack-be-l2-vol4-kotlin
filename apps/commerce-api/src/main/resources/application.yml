server:
  shutdown: graceful
  tomcat:
    threads:
      max: 200 # 최대 워커 스레드 수 (default : 200)
      min-spare: 10 # 최소 유지 스레드 수 (default : 10)
    connection-timeout: 1m # 연결 타임아웃 (ms) (default : 60000ms = 1m)
    max-connections: 8192 # 최대 동시 연결 수 (default : 8192)
    accept-count: 100 # 대기 큐 크기 (default : 100)
    keep-alive-timeout: 60s # 60s
  max-http-request-header-size: 8KB

spring:
  main:
    web-application-type: servlet
  application:
    name: commerce-api
  profiles:
    active: local
  config:
    import:
      - jpa.yml
      - kafka.yml
      - redis.yml
      - logging.yml
      - monitoring.yml

springdoc:
  use-fqn: true
  swagger-ui:
    path: /swagger-ui.html

payment:
  callback-url: http://localhost:8080/api/v1/payments/callback
  callback-secret: ${PAYMENT_CALLBACK_SECRET:local-callback-secret}
  pg-simulator:
    base-url: http://localhost:8082
    connect-timeout: 200ms
    read-timeout: 700ms
    retry-max-attempts: 3
    retry-initial-interval: 100ms
    retry-multiplier: 2.0
    circuit-breaker-sliding-window-size: 10
    circuit-breaker-minimum-number-of-calls: 5
    circuit-breaker-failure-rate-threshold: 50.0
    circuit-breaker-wait-duration-in-open-state: 5s
    circuit-breaker-permitted-calls-in-half-open-state: 2

commerce-events:
  outbox-relay:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: local, test

---
spring:
  config:
    activate:
      on-profile: test

commerce-events:
  outbox-relay:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: qa

---
spring:
  config:
    activate:
      on-profile: prd

springdoc:
  api-docs:
    enabled: false
